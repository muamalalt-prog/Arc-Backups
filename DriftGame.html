<!DOCTYPE html>
<html>
<head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #0a0a14; font-family: 'Segoe UI', Tahoma, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        
        .side-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); color: white; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; font-size: 32px; cursor: pointer; backdrop-filter: blur(8px); transition: all 0.2s; user-select: none; z-index: 10; border-radius: 12px; }
        .side-btn:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.4); transform: translateY(-50%) scale(1.05); }
        .side-btn:active { transform: translateY(-50%) scale(0.95); }
        #prev-btn { left: 30px; }
        #next-btn { right: 30px; }
        
        #car-name { position: absolute; top: 40px; left: 0; right: 0; text-align: center; color: white; font-size: 42px; font-weight: 800; pointer-events: none; text-shadow: 0 4px 12px rgba(0,0,0,0.8); letter-spacing: 2px; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 24px; pointer-events: none; z-index: 20; background: rgba(0,0,0,0.8); padding: 20px 40px; border-radius: 8px; border: 1px solid #fff; }
        
        #play-btn { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); background: linear-gradient(135deg, #00ffcc, #0088ff); border: none; color: #000; padding: 15px 60px; border-radius: 30px; font-size: 28px; font-weight: 900; cursor: pointer; box-shadow: 0 0 20px rgba(0,255,204,0.4); transition: all 0.2s; z-index: 10; display: none; }
        #play-btn:hover { box-shadow: 0 0 40px rgba(0,255,204,0.8); transform: translateX(-50%) scale(1.05); }
        #play-btn:active { transform: translateX(-50%) scale(0.95); }
        
        #stats-panel { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.6); padding: 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); color: white; width: 250px; z-index: 10; display: none; }
        .stat-row { margin-bottom: 12px; }
        .stat-label { font-size: 14px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; color: #aaa; }
        .stat-bar-bg { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden; }
        .stat-bar-fill { height: 100%; background: #00ffcc; width: 0%; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body>
    <div id="stats-panel">
        <div class="stat-row">
            <div class="stat-label">Top Speed</div>
            <div class="stat-bar-bg"><div class="stat-bar-fill" id="stat-speed"></div></div>
        </div>
        <div class="stat-row">
            <div class="stat-label">Acceleration</div>
            <div class="stat-bar-bg"><div class="stat-bar-fill" id="stat-accel"></div></div>
        </div>
        <div class="stat-row">
            <div class="stat-label">Handling</div>
            <div class="stat-bar-bg"><div class="stat-bar-fill" id="stat-handling"></div></div>
        </div>
        <div class="stat-row">
            <div class="stat-label">Braking</div>
            <div class="stat-bar-bg"><div class="stat-bar-fill" id="stat-braking"></div></div>
        </div>
    </div>
    
    <div id="loading">Loading 3D Engine...</div>
    <div id="car-name"></div>
    <button id="play-btn">PLAY</button>
    <div id="prev-btn" class="side-btn" style="display:none">&lt;</div>
    <div id="next-btn" class="side-btn" style="display:none">&gt;</div>
    
    <div id="speedometer" style="position: absolute; bottom: 20px; right: 20px; color: white; font-size: 32px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); display: none;">0 MPH</div>
    <div id="boost-ui" style="position: absolute; bottom: 65px; right: 20px; color: #ff8800; font-size: 28px; font-weight: bold; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); display: none;">BOOST: 100</div>
    
    <script>
        const nicheSupercarNames = [
            "Vortex Hyperion V12",
            "Nebula GT-R",
            "Quantum Apex SS"
        ];
        
        const carStats = [
            { speed: 95, accel: 90, handling: 40, braking: 50 },
            { speed: 75, accel: 80, handling: 85, braking: 70 },
            { speed: 65, accel: 65, handling: 100, braking: 100 }
        ];
        
        let gameState = 'MENU'; 
    
        const scene = new THREE.Scene();
        let fogObj = new THREE.Fog('#0a0a14', 3, 20);
        scene.fog = fogObj;

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 50000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        
        renderer.outputEncoding = THREE.sRGBEncoding;
        
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4); 
        scene.add(ambientLight);
        
        const spotLight = new THREE.SpotLight(0xffffff, 1.5);
        spotLight.position.set(5, 10, 5);
        spotLight.angle = Math.PI / 5;
        spotLight.penumbra = 0.5;
        spotLight.decay = 2;
        spotLight.distance = 50;
        
        scene.add(spotLight);
        scene.add(spotLight.target);
        
        const fillLight = new THREE.DirectionalLight(0xffffff, 0.3);
        fillLight.position.set(-5, 3, -5);
        scene.add(fillLight);

        const gridHelper = new THREE.GridHelper(500, 50, 0x333333, 0x111111);
        gridHelper.position.y = 0;
        scene.add(gridHelper);

        let cars = [];
        let allWheels = [];
        let currentCarIndex = 0;
        let globalModel = null;
        let activeCar = null;
        let mapModel = null;
        
        const particles = [];
        const particleGeo = new THREE.SphereGeometry(0.4, 8, 8); 
        const particleMat = new THREE.MeshBasicMaterial({ color: 0x999999, transparent: true, opacity: 0.7, depthWrite: false });

        let wheelAngle = 0;
        
        const skidmarks = [];
        const skidGeo = new THREE.BoxGeometry(1.2, 0.05, 1);
        const skidMat = new THREE.MeshBasicMaterial({ color: 0x050505, transparent: true, opacity: 0.8, depthWrite: false });
        
        let audioCtx, osc, filter, gainNode;
        let engineInitialized = false;
        
        let velocityVector = new THREE.Vector3();
        let camHeading = 0; 
        
        let carHeading = 0; 
        const globalRaycaster = new THREE.Raycaster();
        let firstFramePlayed = false;
        
        function initAudio() {
            if (engineInitialized) return;
            engineInitialized = true;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            osc = audioCtx.createOscillator();
            filter = audioCtx.createBiquadFilter();
            gainNode = audioCtx.createGain();
            
            osc.type = 'sawtooth';
            filter.type = 'lowpass';
            filter.frequency.value = 400;
            gainNode.gain.value = 0; 
            
            osc.connect(filter);
            filter.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            osc.start();
        }

        const loader = new THREE.GLTFLoader();
        
        loader.load('https://files.catbox.moe/j9vodz.glb', function(gltf) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('prev-btn').style.display = 'flex';
            document.getElementById('next-btn').style.display = 'flex';
            document.getElementById('play-btn').style.display = 'block';
            document.getElementById('stats-panel').style.display = 'block';
            
            globalModel = gltf.scene;
            scene.add(globalModel);
            
            let curr = globalModel;
            while (curr.children.length === 1 && (curr.children[0].type === 'Group' || curr.children[0].type === 'Object3D')) {
                curr = curr.children[0];
            }
            
            curr.children.forEach((child) => {
                let hasMesh = false;
                child.traverse(c => { if(c.isMesh) hasMesh = true; });
                if ((child.type === 'Group' || child.type === 'Object3D') && hasMesh) {
                    cars.push(child);
                    child.userData.associatedWheels = [];
                }
            });
            
            if (cars.length === 0) {
                globalModel.traverse((child) => {
                    if (child.isMesh && child.parent === globalModel) {
                        cars.push(child);
                        child.userData.associatedWheels = [];
                    }
                });
            }
            
            globalModel.traverse((child) => {
                if (child.isMesh) {
                    let isWheel = false;
                    let node = child;
                    while (node && node !== globalModel) {
                        const n = node.name.toLowerCase();
                        if (n.includes('wheel') || n.includes('tire') || n.includes('tyre') || n.includes('rim') ||
                            n.includes('_fl') || n.includes('_fr') || n.includes('_rl') || n.includes('_rr') ||
                            n.includes('w_') || n.includes('wh_')) {
                            isWheel = true;
                            break;
                        }
                        node = node.parent;
                    }
                    if (isWheel) {
                        allWheels.push(child);
                    }
                }
            });
            
            globalModel.updateMatrixWorld(true);
            
            cars.forEach(car => {
                const carBox = new THREE.Box3().setFromObject(car);
                car.userData.carCenter = carBox.getCenter(new THREE.Vector3());
                car.userData.bottomY = carBox.min.y; 
                car.userData.visualOffset = -Math.PI / 2; 
            });
            
            allWheels.forEach(wheel => {
                const wheelBox = new THREE.Box3().setFromObject(wheel);
                const wheelCenter = wheelBox.getCenter(new THREE.Vector3());
                let closestCar = null;
                let minDist = Infinity;
                cars.forEach(car => {
                    const dist = car.userData.carCenter.distanceTo(wheelCenter);
                    if (dist < minDist) {
                        minDist = dist;
                        closestCar = car;
                    }
                });
                if (closestCar && minDist < 15) {
                    closestCar.userData.associatedWheels.push(wheel);
                }
            });
            
            cars.forEach(car => {
                if (car.userData.associatedWheels.length > 0) {
                    car.userData.fused = false;
                    let minZ = Infinity, maxZ = -Infinity;
                    let minX = Infinity, maxX = -Infinity;
                    car.userData.associatedWheels.forEach(w => {
                        const box = new THREE.Box3().setFromObject(w);
                        const worldCenter = box.getCenter(new THREE.Vector3());
                        minZ = Math.min(minZ, worldCenter.z);
                        maxZ = Math.max(maxZ, worldCenter.z);
                        minX = Math.min(minX, worldCenter.x);
                        maxX = Math.max(maxX, worldCenter.x);
                    });
                    const lengthZ = maxZ - minZ;
                    const lengthX = maxX - minX;
                    const useX = lengthX > lengthZ;
                    const mid = useX ? (minX + maxX) / 2 : (minZ + maxZ) / 2;
                    
                    car.userData.associatedWheels.forEach(w => {
                        if (!w.userData.pivot) {
                            const box = new THREE.Box3().setFromObject(w);
                            const worldCenter = box.getCenter(new THREE.Vector3());
                            const pivot = new THREE.Group();
                            const parent = w.parent;
                            const localCenter = parent.worldToLocal(worldCenter.clone());
                            pivot.position.copy(localCenter);
                            parent.add(pivot);
                            pivot.attach(w);
                            w.userData.pivot = pivot;
                            w.userData.isRear = useX ? worldCenter.x < mid : worldCenter.z < mid;
                        }
                    });
                } else {
                    car.userData.fused = true;
                }
            });
            
            if (cars.length === 0) {
                document.getElementById('car-name').innerText = "ERROR: No cars found.";
            } else {
                showCar(0);
            }
        });

        function updateStats(index) {
            const stats = carStats[index % carStats.length];
            document.getElementById('stat-speed').style.width = stats.speed + '%';
            document.getElementById('stat-accel').style.width = stats.accel + '%';
            document.getElementById('stat-handling').style.width = stats.handling + '%';
            document.getElementById('stat-braking').style.width = stats.braking + '%';
            
            const bars = document.querySelectorAll('.stat-bar-fill');
            bars.forEach(b => {
                b.style.background = index === 0 ? '#ff3366' : index === 1 ? '#00ffcc' : '#cc00ff';
            });
        }

        function showCar(index) {
            if (cars.length === 0) return;
            if (index < 0) index = cars.length - 1;
            if (index >= cars.length) index = 0;
            currentCarIndex = index;
            activeCar = cars[currentCarIndex];
            
            globalModel.traverse(c => { if (c.isMesh) c.visible = false; });
            activeCar.traverse(c => { if (c.isMesh) c.visible = true; });
            activeCar.userData.associatedWheels.forEach(w => { w.traverse(c => { if (c.isMesh) c.visible = true; }); });
            
            document.getElementById('car-name').innerText = nicheSupercarNames[currentCarIndex % nicheSupercarNames.length].toUpperCase();
            updateStats(currentCarIndex);
            
            if (gameState === 'MENU') {
                globalModel.position.set(0,0,0);
                globalModel.scale.set(1,1,1); 
                
                activeCar.rotation.set(0, 0, 0); 
                
                globalModel.rotation.set(0, Math.PI, 0); 
                globalModel.updateMatrixWorld(true);
                const box = new THREE.Box3().setFromObject(activeCar);
                activeCar.userData.associatedWheels.forEach(w => box.expandByObject(w));
                const activeCenter = box.getCenter(new THREE.Vector3());
                if (!isNaN(activeCenter.x)) {
                    globalModel.position.x = -activeCenter.x;
                    globalModel.position.y = -box.min.y;
                    globalModel.position.z = -activeCenter.z;
                }
            }
        }

        document.getElementById('prev-btn').addEventListener('click', () => { initAudio(); showCar(currentCarIndex - 1); });
        document.getElementById('next-btn').addEventListener('click', () => { initAudio(); showCar(currentCarIndex + 1); });

        let velocity = 0;
        let steeringAngle = 0;
        let actualSteer = 0;
        let carHeightOffset = 0;
        
        let boostAmount = 100;
        const fireMat = new THREE.MeshBasicMaterial({ color: 0xff4400, transparent: true, opacity: 0.8, depthWrite: false, blending: THREE.AdditiveBlending });
        
        const keys = { w: false, a: false, s: false, d: false, shift: false };

        window.addEventListener('keydown', (e) => {
            initAudio();
            const k = e.key.toLowerCase();
            if(k === 'w' || k === 'arrowup') keys.w = true;
            if(k === 's' || k === 'arrowdown') keys.s = true;
            if(k === 'a' || k === 'arrowleft') keys.a = true;
            if(k === 'd' || k === 'arrowright') keys.d = true;
            if(k === 'shift') keys.shift = true;
            
            if (e.key === '=' || e.key === '+') carHeightOffset += 1.0;
            if (e.key === '-') carHeightOffset -= 1.0;
            
            if (e.key === '[' && activeCar) activeCar.userData.visualOffset += Math.PI / 2;
            if (e.key === ']' && activeCar) activeCar.userData.visualOffset -= Math.PI / 2;
        });

        window.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if(k === 'w' || k === 'arrowup') keys.w = false;
            if(k === 's' || k === 'arrowdown') keys.s = false;
            if(k === 'a' || k === 'arrowleft') keys.a = false;
            if(k === 'd' || k === 'arrowright') keys.d = false;
            if(k === 'shift') keys.shift = false;
        });

        document.getElementById('play-btn').addEventListener('click', () => {
            initAudio();
            document.getElementById('loading').style.display = 'block';
            document.getElementById('loading').innerText = "Loading Track...";
            document.getElementById('prev-btn').style.display = 'none';
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('play-btn').style.display = 'none';
            document.getElementById('stats-panel').style.display = 'none';
            document.getElementById('car-name').style.display = 'none';
            
            scene.remove(gridHelper);
            scene.fog = null;
            
            let mapLoaded = false;
            let mapFallbackTriggered = false;
            
            const triggerFallbackMap = () => {
                if (mapLoaded || mapFallbackTriggered) return;
                mapFallbackTriggered = true;
                console.warn("Map loading timed out or failed! Generating fallback...");
                document.getElementById('loading').innerText = "Map Server Down! Generating track...";
                
                setTimeout(() => {
                    const planeGeo = new THREE.PlaneGeometry(2000, 2000);
                    planeGeo.rotateX(-Math.PI / 2);
                    const planeMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9, metalness: 0.1 });
                    const planeMesh = new THREE.Mesh(planeGeo, planeMat);
                    
                    mapModel = new THREE.Group();
                    mapModel.add(planeMesh);
                    scene.add(mapModel);
                    
                    const grid = new THREE.GridHelper(2000, 100, 0x555555, 0x222222);
                    grid.position.y = 0.1;
                    scene.add(grid);
                    
                    const hemiLight = new THREE.HemisphereLight(0xffffff, 0xffffff, 0.6);
                    hemiLight.position.set(0, 200, 0);
                    scene.add(hemiLight);
                    
                    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
                    dirLight.position.set(100, 200, 50);
                    scene.add(dirLight);
                    
                    globalModel.visible = false;
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('speedometer').style.display = 'block';
                    document.getElementById('boost-ui').style.display = 'block';
                    
                    globalModel.position.set(0, 5, 0); 
                    globalModel.scale.set(3, 3, 3);
                    activeCar.position.set(0,0,0);
                    
                    carHeading = 0; 
                    camHeading = carHeading;
                    
                    ambientLight.intensity = 0.8;
                    spotLight.intensity = 0.5;
                    spotLight.distance = 300;
                    
                    gameState = 'PLAYING';
                }, 1000);
            };
            
            // 30 second timeout
            setTimeout(triggerFallbackMap, 30000);
            
            loader.load('https://files.catbox.moe/o5w8uv.glb', function(mapGltf) {
                if (mapFallbackTriggered) return;
                mapLoaded = true;
                
                mapModel = mapGltf.scene;
                scene.add(mapModel);
                
                mapModel.scale.set(5, 5, 5);
                mapModel.updateMatrixWorld(true);
                
                const mapBox = new THREE.Box3().setFromObject(mapModel);
                const mapCenter = mapBox.getCenter(new THREE.Vector3());
                
                // Keep model hidden until first frame finishes placement
                globalModel.visible = false;
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('speedometer').style.display = 'block';
                document.getElementById('boost-ui').style.display = 'block';
                
                globalModel.position.set(1570.41, -643.17 + 5, 1840.80); 
                globalModel.scale.set(3, 3, 3);
                activeCar.position.set(0,0,0);
                
                carHeading = 4.34; 
                camHeading = carHeading;
                
                ambientLight.intensity = 0.8;
                spotLight.intensity = 0.5;
                spotLight.distance = 300;
                
                gameState = 'PLAYING';
            }, undefined, function(error) {
                triggerFallbackMap();
            });
        });

        let menuAngle = 0;
        let menuGridOffset = 0;

        function animate() {
            requestAnimationFrame(animate);
            
            if (!globalModel || cars.length === 0) {
                renderer.render(scene, camera);
                return;
            }

            if (gameState === 'MENU') {
                menuGridOffset = (menuGridOffset + 2.0) % 10;
                gridHelper.position.x = menuGridOffset;
                
                if (activeCar && !activeCar.userData.fused) {
                    wheelAngle -= 1.0;
                    activeCar.userData.associatedWheels.forEach(w => {
                        if (w.userData.pivot) w.userData.pivot.rotation.set(0, wheelAngle, 0);
                    });
                }
                
                if (activeCar && !activeCar.userData.fused && Math.random() > 0.7) {
                    const menuBackward = new THREE.Vector3(1, 0, 0);
                    
                    activeCar.userData.associatedWheels.forEach(w => {
                        if (w.userData.pivot && Math.random() > 0.5) { 
                            const p = new THREE.Mesh(particleGeo, particleMat);
                            const wheelWorldPos = new THREE.Vector3();
                            w.userData.pivot.getWorldPosition(wheelWorldPos);
                            p.position.copy(wheelWorldPos);
                            p.position.y = -activeCar.userData.bottomY + 0.2; 
                            p.scale.set(0.5, 0.5, 0.5);
                            scene.add(p);
                            
                            const smokeVel = menuBackward.clone().multiplyScalar(0.3 + Math.random()*0.1).add(new THREE.Vector3((Math.random()-0.5)*0.05, Math.random()*0.02, (Math.random()-0.5)*0.05));
                            particles.push({ mesh: p, life: 1.0, velocity: smokeVel, isMenu: true });
                        }
                    });
                }
                
                menuAngle += 0.005;
                const radius = 5; 
                camera.position.set(Math.sin(menuAngle) * radius, 1.8, Math.cos(menuAngle) * radius);
                camera.lookAt(new THREE.Vector3(0, 1, 0));
                
                if (osc && gainNode) {
                    gainNode.gain.value = 0.15; 
                    const baseFreq = [50, 90, 70][currentCarIndex % 3]; 
                    osc.frequency.setTargetAtTime(baseFreq, audioCtx.currentTime, 0.1);
                    filter.frequency.setTargetAtTime(300, audioCtx.currentTime, 0.1);
                }
                
            } else if (gameState === 'PLAYING') {
                if (typeof window.wasBoosting === 'undefined') window.wasBoosting = false;
                let isBoosting = false;
                if (keys.shift && boostAmount > 0 && (window.wasBoosting || boostAmount >= 20)) {
                    isBoosting = true;
                    boostAmount -= 0.5;
                    if (boostAmount < 0) boostAmount = 0;
                } else {
                    boostAmount += 0.0833;
                    if (boostAmount > 100) boostAmount = 100;
                }
                window.wasBoosting = isBoosting;
                document.getElementById('boost-ui').innerText = 'BOOST: ' + Math.floor(boostAmount);
                
                const stats = carStats[currentCarIndex % carStats.length];
                
                const maxSpeed = stats.speed * 0.005 * (isBoosting ? 1.5 : 1.0); 
                const accel = stats.accel * 0.000075 * (isBoosting ? 1.5 : 1.0);
                const braking = stats.braking * 0.00015;
                
                if (keys.w) velocity += accel;
                else if (keys.s) velocity -= braking;
                else {
                    if (velocity > 0) velocity -= braking * 0.2;
                    if (velocity < 0) velocity += braking * 0.2;
                }
                
                if (Math.abs(velocity) < 0.002) velocity = 0;
                velocity = Math.max(-maxSpeed * 0.4, Math.min(velocity, maxSpeed));
                
                if (keys.a) actualSteer = Math.min(actualSteer + 0.075, 0.5);
                else if (keys.d) actualSteer = Math.max(actualSteer - 0.075, -0.5);
                else actualSteer *= 0.7;
                
                if (Math.abs(velocity) > 0.01) {
                    const dir = velocity > 0 ? 1 : -1;
                    let turnRate = 0.35;
                    if (Math.abs(actualSteer) > 0.3) turnRate = 0.15; 
                    carHeading += actualSteer * velocity * turnRate * dir; 
                }
                
                const forward = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0,1,0), carHeading);
                const targetVelocity = forward.multiplyScalar(velocity * 10);
                
                let grip = 0.2; 
                if (Math.abs(actualSteer) > 0.3) grip = 0.03; 
                
                velocityVector.lerp(targetVelocity, grip);
                globalModel.position.add(velocityVector);
                
                let nearbyMeshes = [];
                mapModel.traverse((child) => {
                    if (child.isMesh) {
                        if (!child.geometry.boundingBox) child.geometry.computeBoundingBox();
                        const box = new THREE.Box3().copy(child.geometry.boundingBox).applyMatrix4(child.matrixWorld);
                        if (box.distanceToPoint(globalModel.position) < 50) {
                            nearbyMeshes.push(child);
                        }
                    }
                });
                
                globalRaycaster.set(globalModel.position.clone().add(new THREE.Vector3(0, 50, 0)), new THREE.Vector3(0, -1, 0));
                const intersects = globalRaycaster.intersectObjects(nearbyMeshes, false);
                
                let currentGroundY = globalModel.position.y;
                if (intersects.length > 0) {
                    const hit = intersects[0];
                    currentGroundY = hit.point.y;
                    const chassisLift = 2.2;
                    const targetY = hit.point.y - (activeCar.userData.bottomY * 3) + chassisLift;
                    
                    if (targetY - globalModel.position.y > 2.0 && firstFramePlayed) {
                        velocity = 0; 
                        actualSteer = 0;
                    } else {
                        globalModel.position.y = targetY;
                        
                        const normal = hit.face.normal.clone().transformDirection(hit.object.matrixWorld);
                        const up = new THREE.Vector3(0, 1, 0);
                        
                        const alignQuat = new THREE.Quaternion().setFromUnitVectors(up, normal);
                        const headQuat = new THREE.Quaternion().setFromAxisAngle(up, carHeading);
                        
                        const targetQuat = alignQuat.multiply(headQuat);
                        globalModel.quaternion.slerp(targetQuat, 0.3);
                    }
                } else {
                    globalModel.quaternion.slerp(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), carHeading), 0.3);
                }
                
                if (!activeCar.userData.fused && velocity !== 0) {
                    wheelAngle += velocity * 50; 
                    activeCar.userData.associatedWheels.forEach(w => {
                        if (w.userData.pivot) {
                            if (w.userData.isFront) {
                                w.userData.pivot.rotation.set(0, wheelAngle, -actualSteer * 0.8);
                            } else {
                                w.userData.pivot.rotation.set(0, wheelAngle, 0);
                            }
                        }
                    });
                }
                
                const isFullDrift = Math.abs(actualSteer) >= 0.48 && Math.abs(velocity) > maxSpeed * 0.8;
                if (isFullDrift) {
                    if (!activeCar.userData.fused) {
                        const backward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0,1,0), carHeading);
                        activeCar.userData.associatedWheels.forEach(w => {
                            if (w.userData.pivot && w.userData.isRear) { 
                                const wheelWorldPos = new THREE.Vector3();
                                w.userData.pivot.getWorldPosition(wheelWorldPos);
                                
                                if (Math.random() > 0.1) {
                                    const p = new THREE.Mesh(particleGeo, particleMat);
                                    p.position.copy(wheelWorldPos);
                                    p.position.y = currentGroundY + 0.5; 
                                    scene.add(p);
                                    
                                    const smokeVel = backward.clone().multiplyScalar(0.15 + Math.random()*0.1).add(new THREE.Vector3((Math.random()-0.5)*0.05, Math.random()*0.03, (Math.random()-0.5)*0.05));
                                    particles.push({ mesh: p, life: 1.0, velocity: smokeVel, isMenu: false });
                                }
                                
                                wheelWorldPos.y = currentGroundY + 0.05;
                                if (w.userData.lastSkidPos) {
                                    const dist = w.userData.lastSkidPos.distanceTo(wheelWorldPos);
                                    if (dist > 0.2) {
                                        const s = new THREE.Mesh(skidGeo, skidMat.clone());
                                        s.position.copy(wheelWorldPos).add(w.userData.lastSkidPos).multiplyScalar(0.5);
                                        s.lookAt(wheelWorldPos);
                                        s.scale.set(1, 1, dist);
                                        scene.add(s);
                                        skidmarks.push({ mesh: s, life: 30.0 });
                                        w.userData.lastSkidPos.copy(wheelWorldPos);
                                    }
                                } else {
                                    w.userData.lastSkidPos = wheelWorldPos.clone();
                                }
                            }
                        });
                    }
                } else {
                    if (activeCar) {
                        activeCar.userData.associatedWheels.forEach(w => w.userData.lastSkidPos = null);
                    }
                }
                
                if (isBoosting && velocity > 0) {
                    const backward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0,1,0), carHeading);
                    if (Math.random() > 0.2) {
                        const p = new THREE.Mesh(particleGeo, fireMat);
                        const carPos = new THREE.Vector3();
                        globalModel.getWorldPosition(carPos);
                        carPos.y = currentGroundY + 0.6;
                        carPos.add(backward.clone().multiplyScalar(3.0));
                        p.position.copy(carPos);
                        scene.add(p);
                        
                        const fireVel = backward.clone().multiplyScalar(0.4 + Math.random()*0.2).add(new THREE.Vector3((Math.random()-0.5)*0.1, Math.random()*0.1, (Math.random()-0.5)*0.1));
                        particles.push({ mesh: p, life: 0.6, velocity: fireVel, isMenu: false });
                    }
                }
                
                let targetFov = (isBoosting ? 75 : 45) + (Math.abs(velocity) / maxSpeed) * 20;
                camera.fov += (targetFov - camera.fov) * 0.1;
                camera.updateProjectionMatrix();
                
                const mph = Math.floor(Math.abs(velocity) * 450);
                document.getElementById('speedometer').innerText = mph + ' MPH';
                
                if (osc && gainNode) {
                    gainNode.gain.value = 0.2;
                    const baseFreq = [50, 90, 70][currentCarIndex % 3]; 
                    const targetFreq = baseFreq + Math.abs(velocity) * 600;
                    osc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.1);
                    filter.frequency.setTargetAtTime(400 + Math.abs(velocity) * 1500, audioCtx.currentTime, 0.1);
                }
                
                const carWorldPos = new THREE.Vector3();
                globalModel.getWorldPosition(carWorldPos);
                
                activeCar.rotation.set(0, activeCar.userData.visualOffset, 0);
                
                camHeading += (carHeading - camHeading) * 0.05;
                
                const smoothCamForward = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0,1,0), camHeading);
                
                const camDist = 24;
                const camHeight = 7.0;
                
                const idealCamPos = carWorldPos.clone().sub(smoothCamForward.multiplyScalar(camDist));
                idealCamPos.y += camHeight;
                
                camera.position.copy(idealCamPos);
                camera.lookAt(carWorldPos.clone().add(new THREE.Vector3(0, 2, 0)));
                
                spotLight.position.copy(carWorldPos).add(new THREE.Vector3(0, 60, 0));
                spotLight.target.position.copy(carWorldPos);
                
                if (!firstFramePlayed) {
                    firstFramePlayed = true;
                    globalModel.visible = true;
                }
            }
            
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life -= 0.015; 
                if (p.life <= 0) {
                    scene.remove(p.mesh);
                    particles.splice(i, 1);
                } else {
                    p.mesh.position.add(p.velocity);
                    let s = Math.max(0.01, p.life * 2.0);
                    if (p.isMenu) {
                        s = Math.max(0.01, p.life * 0.8);
                    }
                    p.mesh.scale.set(s, s, s);
                }
            }
            
            for (let i = skidmarks.length - 1; i >= 0; i--) {
                const s = skidmarks[i];
                s.life -= 0.015; 
                if (s.life <= 0) {
                    scene.remove(s.mesh);
                    if (s.mesh.material) s.mesh.material.dispose();
                    skidmarks.splice(i, 1);
                } else if (s.life < 1.0) {
                    s.mesh.material.opacity = 0.8 * s.life; 
                }
            }
            
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
